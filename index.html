<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinicQueue — Real-Time Doctor Token & Wait-Time Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .pulse-dot {
      animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <a href="?" onclick="navigateToRoot(event)" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold text-lg shadow-sm group-hover:bg-teal-700 transition">
          +
        </div>
        <div>
          <span class="font-bold text-slate-900 text-base sm:text-lg tracking-tight">ClinicQueue</span>
          <span class="hidden sm:inline-block text-xs text-slate-400 ml-2 font-medium">Live Real-Time Sync</span>
        </div>
      </a>
      <div id="navRightControls" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- Main Content Container -->

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div id="appRoot">
      <div class="flex flex-col items-center justify-center py-20 text-center">
        <div class="w-10 h-10 border-4 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm font-semibold text-slate-600 mt-4">Connecting to Firebase Real-Time Database...</p>
      </div>
    </div>
  </main>

  <!-- Toast Notification -->

  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white text-sm font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2.5">
      <span id="toastIcon" class="text-teal-400 font-bold">✓</span>
      <span id="toastMessage">Updated</span>
    </div>
  </div>

  <!-- Firebase SDKs -->

  <script type="module">
   import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-analytics.js";


    // =========================================================
    // FIREBASE CONFIGURATION (REPLACE WITH YOUR PROJECT DETAILS)
    // =========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDUEzFe0K-3RUAHMgbKmXc1YvdzSyVU9_E",
    authDomain: "clinicqueue-8c079.firebaseapp.com",
    projectId: "clinicqueue-8c079",
    storageBucket: "clinicqueue-8c079.firebasestorage.app",
    messagingSenderId: "792700690553",
    appId: "1:792700690553:web:769d5c12376a6a6aab34a8",
    measurementId: "G-PGX0BL4QLE"
    };


    // Initialize Firebase
    onst app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);


    const STATE_DOC_REF = doc(db, "clinics", "main_queue_state");


    const DEFAULT_STATE = {
      admin: { username: 'admin', password: 'admin123' },
      doctors: [
        {
          id: 'sharma',
          name: 'Dr. A. K. Sharma',
          specialty: 'General Physician & Diabetologist',
          room: 'Room 101',
          username: 'sharma',
          password: 'clinic123',
          avgMins: 10,
          currentToken: 6,
          totalTokens: 18,
          status: 'open',
          breakDelayMins: 0,
          sessionStartedAt: Date.now() - (48 * 60000),
          pausedAt: null,
          totalPausedMs: 0
        },
        {
          id: 'nair',
          name: 'Dr. Priya Nair',
          specialty: 'Pediatrician',
          room: 'Room 102',
          username: 'nair',
          password: 'clinic123',
          avgMins: 8,
          currentToken: 3,
          totalTokens: 14,
          status: 'open',
          breakDelayMins: 0,
          sessionStartedAt: Date.now() - (16 * 60000),
          pausedAt: null,
          totalPausedMs: 0
        }
      ]
    };


    window.appState = null;
    window.currentView = 'auto';
    window.lookupTokenNumber = '';
    window.editingDoctorId = null;


    // Save state to Firestore
    window.saveState = async function(newState) {
      try {
        await setDoc(STATE_DOC_REF, newState);
      } catch (e) {
        console.error("Error saving state to Firestore:", e);
        showToast("Error syncing with cloud database", true);
      }
    };


    // Authentication session storage
    const SESSION_KEY = 'clinicqueue_auth_session_v2';
    window.getAuthSession = function() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    };


    window.setAuthSession = function(session) {
      if (!session) {
        sessionStorage.removeItem(SESSION_KEY);
      } else {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      }
    };


    // =========================================================
    // HYBRID DYNAMIC WAIT-TIME LOGIC
    // =========================================================
    const WARMUP_PATIENT_COUNT = 5;


    window.getEffectiveAvgInfo = function(doctor) {
      const patientsSeen = Math.max(0, (doctor.currentToken || 0) - 1);
      if (patientsSeen < WARMUP_PATIENT_COUNT || !doctor.sessionStartedAt) {
        return { effectiveMins: Number(doctor.avgMins) || 10, mode: 'standard', patientsSeen };
      }
      const currentPauseMs = (doctor.status === 'break' && doctor.pausedAt) ? (Date.now() - doctor.pausedAt) : 0;
      const totalPaused = (doctor.totalPausedMs || 0) + currentPauseMs;
      const activeElapsedMs = Math.max(60000, Date.now() - doctor.sessionStartedAt - totalPaused);
      const activeElapsedMins = activeElapsedMs / 60000;
      const rawCalculated = activeElapsedMins / patientsSeen;
      const clamped = Math.max(2, Math.min(45, Math.round(rawCalculated * 10) / 10));
      return { effectiveMins: clamped, mode: 'live', patientsSeen };
    };


    window.calculateWaitForToken = function(doctor, targetToken) {
      const current = doctor.currentToken || 0;
      if (targetToken < current) return { state: 'passed', waitMins: 0, etaString: 'Already called' };
      if (targetToken === current) return { state: 'serving', waitMins: 0, etaString: 'Now in cabin' };


      const { effectiveMins } = getEffectiveAvgInfo(doctor);
      const tokensAhead = targetToken - current;
      const breakBuffer = doctor.status === 'break' ? (Number(doctor.breakDelayMins) || 0) : 0;
      const waitMins = Math.round(tokensAhead * effectiveMins + breakBuffer);
      const etaDate = new Date(Date.now() + waitMins * 60000);
      const etaString = etaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });


      return { state: 'waiting', tokensAhead, waitMins, etaString };
    };


    // =========================================================
    // URL ROUTING HELPERS
    // =========================================================
    window.getDoctorIdFromUrl = function() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('doctor')) return params.get('doctor').trim().toLowerCase();
      const match = (window.location.hash || '').match(/#\/doctor\/([a-zA-Z0-9_-]+)/);
      if (match) return match[1].toLowerCase();
      return null;
    };


    window.getDoctorShareUrl = function(doctorId) {
      const url = new URL(window.location.href);
      url.search = `?doctor=${encodeURIComponent(doctorId)}`;
      url.hash = '';
      return url.toString();
    };


    window.navigateToDoctor = function(doctorId) {
      const url = new URL(window.location.href);
      url.search = `?doctor=${encodeURIComponent(doctorId)}`;
      url.hash = '';
      window.history.pushState({}, '', url);
      window.currentView = 'auto';
      window.lookupTokenNumber = '';
      render();
    };


    window.navigateToRoot = function(e) {
      if (e) e.preventDefault();
      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';
      window.history.pushState({}, '', url);
      window.currentView = 'auto';
      window.lookupTokenNumber = '';
      render();
    };


    window.addEventListener('popstate', () => { window.currentView = 'auto'; render(); });


    // =========================================================
    // UI UTILITIES & TOAST
    // =========================================================
    let toastTimer = null;
    window.showToast = function(message, isError = false) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastMessage');
      icon.textContent = isError ? '!' : '✓';
      icon.className = isError ? 'text-rose-400 font-bold' : 'text-teal-400 font-bold';
      msg.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2800);
    };


    window.copyText = function(text, successMsg = 'Copied to clipboard!') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    };


    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(successMsg);
    }


    window.escapeHtml = function(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    };


    window.getQrImageUrl = function(dataUrl) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&data=${encodeURIComponent(dataUrl)}`;
    };


    // =========================================================
    // RENDER CONTROLS & VIEWS
    // =========================================================
    window.renderNav = function() {
      const nav = document.getElementById('navRightControls');
      const session = getAuthSession();
      if (session) {
        const label = session.role === 'admin' ? 'Clinic Admin' : (appState.doctors.find(d => d.id === session.doctorId)?.name || 'Staff');
        nav.innerHTML = `
          <button onclick="openDashboard()" class="text-xs sm:text-sm font-semibold px-3 py-1.5 rounded-lg bg-teal-50 text-teal-700 border border-teal-200 hover:bg-teal-100 transition">${escapeHtml(label)} Panel</button>
          <button onclick="handleLogout()" class="text-xs sm:text-sm font-medium px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 border border-slate-200 transition">Log Out</button>
        `;
      } else {
        nav.innerHTML = `<button onclick="openLogin()" class="text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition shadow-sm">Staff / Admin Login</button>`;
      }
    };


    window.openLogin = function() { window.currentView = 'login'; render(); };
    window.openDashboard = function() { window.currentView = 'dashboard'; render(); };
    window.handleLogout = function() { setAuthSession(null); window.currentView = 'auto'; showToast('Logged out'); render(); };


    // --- Patient View ---
    function renderPatientDoctorView(doctor) {
      const avgInfo = getEffectiveAvgInfo(doctor);
      const statusBadges = {
        open: `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"><span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot"></span> Clinic Open</span>`,
        break: `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200"><span class="w-2 h-2 rounded-full bg-amber-500"></span> On Break (+${doctor.breakDelayMins || 0}m)</span>`,
        closed: `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Closed</span>`
      };


      const paceLabel = avgInfo.mode === 'live'
        ? `<span class="inline-flex items-center gap-1 text-xs font-medium text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-full border border-teal-200">⚡ Live Pace: ~${avgInfo.effectiveMins} min/pt</span>`
        : `<span class="inline-flex items-center gap-1 text-xs font-medium text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded-full">⏱ Standard Pace: ~${avgInfo.effectiveMins} min/pt</span>`;


      const lookupResultHtml = getLookupResultHtml(doctor);
      const startTok = Math.max(1, doctor.currentToken);
      const endTok = Math.max(startTok, doctor.totalTokens);
      let rowsHtml = '';


      if (doctor.status === 'closed') {
        rowsHtml = `<tr><td colspan="4" class="px-4 py-8 text-center text-sm text-slate-500">Clinic session is currently closed.</td></tr>`;
      } else if (endTok < startTok) {
        rowsHtml = `<tr><td colspan="4" class="px-4 py-8 text-center text-sm text-slate-500">No active tokens in queue.</td></tr>`;
      } else {
        for (let t = startTok; t <= endTok; t++) {
          const calc = calculateWaitForToken(doctor, t);
          const isCurrent = t === doctor.currentToken;
          rowsHtml += `
            <tr class="${isCurrent ? 'bg-teal-50/70 font-semibold' : 'hover:bg-slate-50'} border-b border-slate-100 last:border-0">
              <td class="px-4 py-3 text-sm"><span class="inline-flex items-center justify-center w-9 h-7 rounded-lg ${isCurrent ? 'bg-teal-600 text-white font-bold' : 'bg-slate-100 text-slate-800 font-semibold'}">#${t}</span></td>
              <td class="px-4 py-3 text-sm">${isCurrent ? '<span class="text-teal-700 font-semibold">Now Serving</span>' : `<span class="text-slate-600">${calc.tokensAhead} ahead</span>`}</td>
              <td class="px-4 py-3 text-sm text-slate-700">${isCurrent ? '0 mins' : `~${calc.waitMins} mins`}</td>
              <td class="px-4 py-3 text-sm font-semibold text-right ${isCurrent ? 'text-teal-700' : 'text-slate-900'}">${calc.etaString}</td>
            </tr>`;
        }
      }


      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div class="text-xs font-semibold uppercase tracking-wider text-teal-600">${escapeHtml(doctor.room)}</div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-0.5">${escapeHtml(doctor.name)}</h1>
                <p class="text-sm text-slate-500">${escapeHtml(doctor.specialty)}</p>
              </div>
              <div>${statusBadges[doctor.status] || statusBadges.open}</div>
            </div>


            <div class="mt-6 bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 text-white flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="text-center sm:text-left">
                <div class="text-xs uppercase tracking-widest text-teal-300 font-semibold">Now Serving Token</div>
                <div class="text-5xl sm:text-6xl font-extrabold tracking-tight mt-1">#${doctor.currentToken > 0 ? doctor.currentToken : '—'}</div>
                <div class="text-xs text-slate-300 mt-2">Total Issued: <strong class="text-white">${doctor.totalTokens}</strong></div>
              </div>
              <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 text-center sm:text-right border border-white/10 w-full sm:w-auto">
                <div class="text-xs text-slate-300">Consultation Pace</div>
                <div class="text-2xl font-bold text-teal-300 mt-0.5">~${avgInfo.effectiveMins} mins</div>
              </div>
            </div>


            <div class="mt-6 pt-5 border-t border-slate-100">
              <label class="block text-sm font-semibold text-slate-800 mb-2">Check Your Token Wait Time</label>
              <div class="flex gap-2">
                <input id="tokenLookupInput" type="number" min="1" placeholder="Enter your token #" value="${escapeHtml(window.lookupTokenNumber)}" oninput="handleLookupInput(this.value)" class="flex-1 rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
                ${window.lookupTokenNumber ? `<button onclick="handleLookupInput('')" class="px-3 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Clear</button>` : ''}
              </div>
              <div id="lookupResultContainer">${lookupResultHtml}</div>
            </div>
          </div>


          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">${paceLabel}</div>
            <div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500"><th class="px-4 py-3">Token</th><th class="px-4 py-3">Position</th><th class="px-4 py-3">Est. Wait</th><th class="px-4 py-3 text-right">Time</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>
          </div>
        </div>
      `;
    }


    function getLookupResultHtml(doctor) {
      if (window.lookupTokenNumber === '' || isNaN(Number(window.lookupTokenNumber)) || Number(window.lookupTokenNumber) <= 0) return '';
      const tok = Number(window.lookupTokenNumber);
      const res = calculateWaitForToken(doctor, tok);
      if (res.state === 'passed') return `<div class="mt-4 p-4 rounded-xl bg-slate-100 text-slate-700 text-sm">Token <strong>#${tok}</strong> has already passed.</div>`;
      if (res.state === 'serving') return `<div class="mt-4 p-4 rounded-xl bg-emerald-50 text-emerald-900 text-sm font-medium">🎉 Token <strong>#${tok}</strong> is <strong>NOW BEING SERVED</strong>!</div>`;
      return `<div class="mt-4 p-4 rounded-xl bg-teal-50 text-teal-900 text-sm flex justify-between"><div>Token #${tok} Wait: <strong>~${res.waitMins}m</strong></div><div class="font-bold">${res.etaString}</div></div>`;
    }


    window.handleLookupInput = function(val) {
      window.lookupTokenNumber = val;
      const container = document.getElementById('lookupResultContainer');
      const doc = window.appState.doctors.find(d => d.id === getDoctorIdFromUrl());
      if (container && doc) container.innerHTML = getLookupResultHtml(doc);
    };


    // --- Root Portal ---
    function renderRootPortal() {
      const cards = window.appState.doctors.map(doc => `
        <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col justify-between gap-4 shadow-sm">
          <div>
            <div class="flex justify-between"><span class="text-xs font-bold text-teal-600">${escapeHtml(doc.room)}</span><span class="text-xs px-2 py-0.5 rounded-full ${doc.status === 'open' ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'}">${doc.status}</span></div>
            <h3 class="font-bold text-slate-900 text-lg mt-1">${escapeHtml(doc.name)}</h3>
            <p class="text-xs text-slate-500">${escapeHtml(doc.specialty)}</p>
          </div>
          <button onclick="navigateToDoctor('${escapeHtml(doc.id)}')" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold py-2.5 rounded-xl transition">Open Patient Queue</button>
        </div>
      `).join('');


      return `<div class="max-w-3xl mx-auto space-y-6"><div class="bg-white rounded-2xl border border-slate-200 p-8 text-center"><h1 class="text-2xl font-extrabold text-slate-900">Patient Queue Portal</h1><p class="text-sm text-slate-600 mt-1">Select a doctor to view real-time token queues.</p></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${cards}</div></div>`;
    }


    // --- Login View ---
    function renderLoginView() {
      return `
        <div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm">
          <h1 class="text-xl font-extrabold text-slate-900 text-center mb-6">Staff & Admin Login</h1>
          <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">Username</label><input id="loginUser" type="text" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm" /></div>
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">Password</label><input id="loginPass" type="password" required class="w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-sm" /></div>
            <button type="submit" class="w-full bg-teal-600 text-white font-semibold py-2.5 rounded-xl text-sm">Sign In</button>
          </form>
          <div class="mt-4 text-xs text-slate-500 text-center">Demo Staff: <strong>sharma</strong> / <strong>clinic123</strong><br>Admin: <strong>admin</strong> / <strong>admin123</strong></div>
        </div>
      `;
    }


    window.handleLoginSubmit = function(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      if (user === window.appState.admin.username && pass === window.appState.admin.password) {
        setAuthSession({ role: 'admin' });
        window.currentView = 'dashboard';
        showToast('Logged in as Admin');
        render();
        return;
      }
      const doc = window.appState.doctors.find(d => d.username === user && d.password === pass);
      if (doc) {
        setAuthSession({ role: 'doctor', doctorId: doc.id });
        window.currentView = 'dashboard';
        showToast(`Logged in for ${doc.name}`);
        render();
        return;
      }
      showToast('Invalid credentials', true);
    };


    // --- Receptionist Control Panel ---
    function renderDoctorControlPanel(doctor) {
      const shareUrl = getDoctorShareUrl(doctor.id);
      const qrUrl = getQrImageUrl(shareUrl);
      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex justify-between items-center">
            <div><h1 class="text-xl font-extrabold text-slate-900">${escapeHtml(doctor.name)}</h1><p class="text-xs text-slate-500">${escapeHtml(doctor.room)}</p></div>
            <button onclick="navigateToDoctor('${escapeHtml(doctor.id)}')" class="px-3 py-2 bg-slate-100 rounded-xl text-xs font-semibold">Preview Patient View ↗</button>
          </div>


          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between">
              <div>
                <div class="text-xs font-bold text-slate-400 uppercase">Current Token</div>
                <div class="text-6xl font-extrabold text-slate-900 my-4 text-center">#${doctor.currentToken}</div>
              </div>
              <div class="space-y-2.5">
                <button onclick="advanceToken('${escapeHtml(doctor.id)}', 1)" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl">+1 Next Patient</button>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="advanceToken('${escapeHtml(doctor.id)}', -1)" class="py-2.5 border rounded-xl text-xs font-semibold">-1 Previous</button>
                  <button onclick="issueWalkInToken('${escapeHtml(doctor.id)}')" class="py-2.5 bg-slate-900 text-white rounded-xl text-xs font-semibold">+ Issue Token (#${doctor.totalTokens + 1})</button>
                </div>
              </div>
            </div>


            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
              <div class="text-xs font-bold uppercase text-slate-500">Status</div>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="setDoctorStatus('${escapeHtml(doctor.id)}', 'open')" class="py-2 rounded-xl text-xs font-semibold ${doctor.status === 'open' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">Open</button>
                <button onclick="setDoctorStatus('${escapeHtml(doctor.id)}', 'break')" class="py-2 rounded-xl text-xs font-semibold ${doctor.status === 'break' ? 'bg-amber-500 text-white' : 'bg-slate-100'}">Break</button>
                <button onclick="setDoctorStatus('${escapeHtml(doctor.id)}', 'closed')" class="py-2 rounded-xl text-xs font-semibold ${doctor.status === 'closed' ? 'bg-rose-600 text-white' : 'bg-slate-100'}">Closed</button>
              </div>
              <button onclick="resetQueue('${escapeHtml(doctor.id)}')" class="w-full py-2 bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold">Reset Queue</button>
            </div>
          </div>


          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex items-center gap-5">
            <img src="${qrUrl}" class="w-24 h-24 border p-1 rounded-xl" />
            <div>
              <div class="text-xs font-bold text-teal-600">Patient QR Code Link</div>
              <input type="text" readonly value="${escapeHtml(shareUrl)}" class="w-full text-xs bg-slate-50 border rounded-lg px-3 py-2 mt-2" />
              <button onclick="copyText('${escapeHtml(shareUrl)}')" class="mt-2 px-3 py-1.5 bg-slate-900 text-white text-xs rounded-lg font-semibold">Copy Link</button>
            </div>
          </div>
        </div>
      `;
    }


    window.advanceToken = async function(doctorId, delta) {
      const doc = window.appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;
      doc.currentToken = Math.max(0, doc.currentToken + delta);
      if (doc.currentToken > doc.totalTokens) doc.totalTokens = doc.currentToken;
      if (!doc.sessionStartedAt && doc.currentToken > 0) doc.sessionStartedAt = Date.now();
      await saveState(window.appState);
      showToast(`Token #${doc.currentToken}`);
    };


    window.issueWalkInToken = async function(doctorId) {
      const doc = window.appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;
      doc.totalTokens += 1;
      await saveState(window.appState);
      showToast(`Issued Token #${doc.totalTokens}`);
    };


    window.setDoctorStatus = async function(doctorId, status) {
      const doc = window.appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;
      doc.status = status;
      await saveState(window.appState);
      showToast(`Status: ${status}`);
    };


    window.resetQueue = async function(doctorId) {
      const doc = window.appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;
      doc.currentToken = 0;
      doc.totalTokens = 0;
      doc.sessionStartedAt = null;
      await saveState(window.appState);
      showToast('Queue reset');
    };


    // --- Master Render Function ---
    window.render = function() {
      if (!window.appState) return;
      renderNav();
      const root = document.getElementById('appRoot');
      const session = getAuthSession();


      if (window.currentView === 'login') { root.innerHTML = renderLoginView(); return; }
      if (window.currentView === 'dashboard' && session) {
        if (session.role === 'admin') {
          root.innerHTML = `<div class="text-center py-10 font-bold">Admin Dashboard Active</div>`;
        } else {
          const doc = window.appState.doctors.find(d => d.id === session.doctorId);
          root.innerHTML = renderDoctorControlPanel(doc);
        }
        return;
      }


      const urlDocId = getDoctorIdFromUrl();
      if (urlDocId) {
        const doc = window.appState.doctors.find(d => d.id === urlDocId);
        root.innerHTML = doc ? renderPatientDoctorView(doc) : `<div class="text-center py-12">Doctor not found</div>`;
        return;
      }


      if (session && window.currentView === 'auto') { window.currentView = 'dashboard'; render(); return; }
      root.innerHTML = renderRootPortal();
    };


    // =========================================================
    // REAL-TIME FIRESTORE LISTENER (SYNC ACROSS DEVICES)
    // =========================================================
    onSnapshot(STATE_DOC_REF, (docSnap) => {
      if (docSnap.exists()) {
        window.appState = docSnap.data();
      } else {
        // Initialize Firebase with default state if empty
        setDoc(STATE_DOC_REF, DEFAULT_STATE);
        window.appState = DEFAULT_STATE;
      }
      render();
    }, (error) => {
      console.error("Firestore sync error:", error);
      document.getElementById('appRoot').innerHTML = `<div class="p-8 text-center text-rose-600 font-semibold">Firebase Connection Error. Please check your credentials in the script configuration.</div>`;
    });
  </script>

</body>
</html>
